name: Code Quality Check

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install flake8
      run: |
        pip install flake8

    - name: Run flake8
      run: |
        flake8 fraud_system.py || true
